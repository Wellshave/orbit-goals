[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serverfuncties in Frankfurt, naast de Supabase-database (eu-central-1). Standaard draaien ze in
# Ohio en kost elke databasevraag een oversteek over de Atlantische Oceaan (~100 ms per keer).
# ___netlify-server-handler is de functie die de Next.js-runtime genereert voor alle pagina's.
[functions."___netlify-server-handler"]
  region = "fra"

[functions.keep-warm]
  region = "fra"
