[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Functieregio: Frankfurt (eu-central-1), naast de Supabase-database. Die staat in het Netlify-dashboard
# (Project configuration → Build & deploy → Functions → Functions region): de Next.js-runtime genereert de
# serverfunctie zelf, dus een region-regel per functie in dit bestand wordt daarvoor genegeerd.
# Controleer na een deploy met /api/health ("region" hoort "eu-central-1" te zijn).
